/* ===== MUONEKANO MPYA: themes, gradients, charts ===== */
body.dr.dk{--bg:#101820;--card:#17222d;--tx:#e6edf3;--mu:#9bacb8;--bd:#2a3a48;--er:#ff8787}

.pnl,body.dr .card,.stat{border-radius:10px}

.stat span{font-size:26px}.stat b{font-size:30px;color:var(--pr)}

th{background:var(--pr2);color:var(--pr);font-weight:700}

<script>
const LV={
zahanati:{n:"Zahanati",o:{usajili:"receptionist",malipo:"receptionist",triage:"nurse",rch:"nurse",opd:"clinician",rufaa:"clinician",famasia:"dispenser",ripoti:"data_officer"}},
kituo:{n:"Kituo cha Afya",o:{usajili:"receptionist",triage:"nurse",wodi:"nurse",opd:"clinician",rufaa:"clinician",uzazi:"midwife",rch:"midwife",maabara:"lab_tech",famasia:"pharmacist",malipo:"cashier",stoo:"store_keeper",ripoti:"data_officer"}},
wilaya:{n:"Hospitali ya Wilaya",o:{usajili:"receptionist",triage:"nurse",wodi:"nurse",opd:"doctor",rufaa:"doctor",icu:"doctor",uzazi:"midwife",rch:"midwife",maabara:"lab_tech",radiolojia:"radiologist",upasuaji:"theatre_staff",mortuary:"mortuary_attendant",famasia:"pharmacist",malipo:"cashier",stoo:"store_keeper",ripoti:"data_officer"}}};
LV.mkoa={...LV.wilaya,n:"Hospitali ya Rufaa ya Mkoa"};

Object.values(LV).forEach(L=>{L.m=Object.keys(L.o);L.r=["facility_admin",...new Set(Object.values(L.o))]});
// Kila module ina role moja tu kwa ngazi (LV.o).
const MD={usajili:["📝","Usajili"],triage:["🩺","Triage / Vitals"],opd:["👨‍⚕️","OPD – Daktari"],maabara:["🧪","Maabara"],radiolojia:["📡","Radiolojia"],famasia:["💊","Famasia"],malipo:["💳","Malipo"],wodi:["🛏️","Wodi"],uzazi:["🤰","Uzazi"],rch:["👶","RCH"],rufaa:["🔁","Rufaa"],upasuaji:["🔪","Upasuaji"],stoo:["📦","Stoo"],icu:["❤️‍🩹","ICU"],ripoti:["📊","Ripoti"]};
const MIKOA=["Arusha","Dar es Salaam","Dodoma","Geita","Iringa","Kagera","Katavi","Kigoma","Kilimanjaro","Lindi","Manyara","Mara","Mbeya","Morogoro","Mtwara","Mwanza","Njombe","Pwani","Rukwa","Ruvuma","Shinyanga","Simiyu","Singida","Songwe","Tabora","Tanga","Unguja Kaskazini","Unguja Kusini","Mjini Magharibi","Pemba Kaskazini","Pemba Kusini"];
const LAB=["Malaria RDT","Malaria BS (Smear)","FBP / CBC","Hemoglobin","Blood Sugar (RBS)","Urinalysis","Stool Analysis","HIV Test","Widal Test","Pregnancy Test (UPT)","Creatinine","Liver Function Test","Syphilis (VDRL)","Hepatitis B"];
const RAD=["X-Ray Kifua","X-Ray Mfupa","Ultrasound Tumbo","Ultrasound Pelvic","CT Scan","ECG"];
const ICD=["B50 – Malaria","J18 – Pneumonia","J06 – URTI","N39.0 – UTI","I10 – Hypertension","E11 – Diabetes Mellitus Type 2","A09 – Gastroenteritis","A01 – Typhoid Fever","D64 – Anaemia","J45 – Asthma","B24 – HIV Disease","A15 – Tuberculosis","L08 – Skin Infection","K29 – Gastritis","B76 – Hookworm / Helminthiasis","O80 – Normal Delivery","T14 – Injury / Wound","R50 – Fever (Unspecified)"];
const DRUGS=["Paracetamol 500mg","Amoxicillin 500mg","Artemether/Lumefantrine (ALu)","Ibuprofen 400mg","Metronidazole 400mg","Ciprofloxacin 500mg","ORS","Zinc 20mg","Cotrimoxazole 480mg","Amlodipine 5mg","Metformin 500mg","Salbutamol Inhaler","Omeprazole 20mg","Albendazole 400mg","Ferrous Sulphate"];
const SA={email:"armandocodester@gmail.com",hash:"cc4a22607a2d9ec5e1d784ad43eca56610d02c3ccb0cc12ddc929e72973e3b68"};
const PH=["Usajili wa wagonjwa kwa kata na mtaa","Vituo vya mikoa yote","Huduma bora kwa kila ngazi","Usimamizi salama wa kituo chako"];
let DB={fac:[],users:[],pts:[],w:[],k:[],m:[],vs:[]},me=null,tab="dash",err="",tk=0,cv=null,ct=0,dq="wait";
try{const s=localStorage.getItem("phms");if(s)Object.assign(DB,JSON.parse(s))}catch(e){}
if(!Array.isArray(DB.vs))DB.vs=[];
const lsSave=()=>{try{localStorage.setItem("phms",JSON.stringify(DB))}catch(e){}};
const save=()=>{lsSave();ghSched()};
/* ===== GITHUB DATABASE SYNC (data/phms.json kwenye repo ya GitHub) ===== */
const ghc=()=>{try{return JSON.parse(localStorage.getItem("phms_gh")||"{}")}catch(e){return{}}};
let ghSha=null,ghT=null,ghBusy=false,ghAgain=false,ghSt="";
const ghOn=()=>!!ghc().key;
const ghDirty=v=>{try{v===undefined?0:(v?localStorage.setItem("phms_gd","1"):localStorage.removeItem("phms_gd"));return localStorage.getItem("phms_gd")==="1"}catch(e){return false}};
const ghUI=t=>{ghSt=t;const e=document.getElementById("ghs");if(e)e.textContent=t};
const b64e=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const b64d=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const ghU=()=>(ghc().url||"").replace(/\/+$/,"")+"/api/data";
const ghH=()=>({Authorization:"Bearer "+ghc().key,"Content-Type":"application/json"});
async function gk(p,salt){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function pack(o){const t=JSON.stringify(o),p=ghc().pass;if(!p)return t;const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await gk(p,salt),d=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(t)));return JSON.stringify({enc:1,salt:b64e(salt),iv:b64e(iv),data:b64e(d)})}
async function unpack(t){const j=JSON.parse(t);if(!j.enc)return j;const p=ghc().pass;if(!p)throw new Error("Data kwenye GitHub imesimbwa — weka nenosiri la usimbaji");try{const k=await gk(p,b64d(j.salt));return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(j.iv)},k,b64d(j.data))))}catch(e){throw new Error("Nenosiri la usimbaji si sahihi")}}
function ghErr(r){return new Error(r.status===401?"Ufunguo wa sync si sahihi":r.status===429?"Maombi mengi — subiri kidogo":r.status>=500?"Seva ya sync/GitHub haipatikani":"Seva "+r.status)}
async function ghGet(){const r=await fetch(ghU()+"?_="+Date.now(),{headers:ghH(),cache:"no-store"});if(!r.ok)throw ghErr(r);const j=await r.json();ghSha=j.sha||null;if(!j.content)return null;return unpack(new TextDecoder().decode(b64d(j.content)))}
function merge(rem,loc){const o={...rem,...loc},kf=x=>x&&typeof x==="object"?(x.id??x.no??x.email??JSON.stringify(x)):x;
 Object.keys(DB).forEach(k=>{if(Array.isArray(DB[k])){const m=new Map();(rem[k]||[]).forEach(x=>m.set(kf(x),x));(loc[k]||[]).forEach(x=>m.set(kf(x),x));o[k]=[...m.values()]}});return o}
function ghSched(){if(!ghOn())return;ghDirty(true);clearTimeout(ghT);ghUI("⏳ Inasubiri kuhifadhi GitHub…");ghT=setTimeout(ghPush,1500)}
async function ghPush(){if(!ghOn())return ghUI("GitHub haijawekwa");if(ghBusy){ghAgain=true;return}
 ghBusy=true;ghAgain=false;ghUI("⏳ Inahifadhi GitHub…");let ok=false;
 try{for(let n=0;n<3&&!ok;n++){const body={content:b64e(new TextEncoder().encode(await pack(DB)))};if(ghSha)body.sha=ghSha;
   const r=await fetch(ghU(),{method:"PUT",headers:ghH(),body:JSON.stringify(body)});
   if(r.ok){ghSha=(await r.json()).sha;ok=true}
   else if(r.status===409){const rem=await ghGet();if(rem){Object.assign(DB,merge(rem,DB));lsSave()}}
   else throw ghErr(r)}
  if(ok){if(!ghAgain)ghDirty(false);ghUI("✅ Imehifadhiwa GitHub "+new Date().toLocaleTimeString("sw-TZ"))}else ghUI("⚠️ Mgongano wa data — jaribu tena")}
 catch(e){ghUI("⚠️ "+(e.message||e)+" (data iko salama kwenye kivinjari)")}
 ghBusy=false;if(ghAgain)ghSched()}
async function ghPull(redraw){if(!ghOn())return;ghUI("⏳ Inavuta data kutoka GitHub…");
 try{const rem=await ghGet(),dirty=ghDirty();
  if(rem){const had=Array.isArray(rem.fac);if(!had)throw new Error("Faili la GitHub si la PHMS");Object.assign(DB,dirty?merge(rem,DB):rem);if(!Array.isArray(DB.vs))DB.vs=[];lsSave();ghUI("✅ Data imevutwa kutoka GitHub");if(dirty)ghSched()}
  else{ghUI("ℹ️ Faili jipya litaundwa GitHub");ghSched()}
  if(redraw&&!(me==null&&($("#e")?.value||$("#p")?.value)))draw()}

 if(cv){const v=gv();if(v&&v.fid==me.fid)return cons(v);cv=null}
 const all=DB.vs.filter(v=>v.fid==me.fid),W=all.filter(v=>v.st==="doctor"),S=all.filter(v=>["closed","referred"].includes(v.st)),A=all.filter(v=>v.st==="admitted"),L=(dq==="wait"?W:dq==="adm"?A:S).slice().reverse();
 return `<div class="pnl"><h3>OPD – Orodha ya Wagonjwa</h3><div class="pb"><div class="tabs"><button class="${dq==="wait"?"on":""}" onclick="dq='wait';rv()">Wanaosubiri (${W.length})</button><button class="${dq==="seen"?"on":""}" onclick="dq='seen';rv()">Waliohudumiwa (${S.length})</button><button class="${dq==="adm"?"on":""}" onclick="dq='adm';rv()">Waliolazwa (${A.length})</button></div>
 <input placeholder="Tafuta jina au namba..." oninput="fq(this.value)" style="width:100%;margin:10px 0"><div class="tw"><table><tr><th>Namba</th><th>Jina</th><th>Umri/Jinsia</th><th>Malipo</th><th>Vitals</th><th>Muda</th><th>Hali</th><th></th></tr>${L.map(v=>{const p=pt(v.pid);return `<tr class="fr"><td>${p.no}</td><td>${esc(p.name)}</td><td>${esc(p.age)} / ${p.g}</td><td>${esc(p.pay||"-")}</td><td>${vsum(v)}</td><td>${tm(v.at)}</td><td>${stb(v.st)}${vnew(v)?` <span class="alg" style="background:#2b8a3e">Majibu mapya ${vnew(v)}</span>`:""}</td><td><button class="b" onclick="openV('${v.id}')">${v.st==="doctor"?"Anza / Endelea":"Angalia"}</button>${v.st==="admitted"?` <button class="b" onclick="dis('${v.id}')">Ruhusu</button>`:""}</td></tr>`}).join("")||`<tr><td class="mu">Hakuna wagonjwa</td></tr>`}</table></div></div></div>`}
function openV(id){const v=DB.vs.find(x=>x.id===id);if(!v||v.fid!=me.fid)return;if(!v.cons)v.cons={cc:"",dur:"",hpi:"",pmh:"",alg:"",dh:"",fh:"",sh:"",ex:"",cvs:"",rs:"",abd:"",cns:"",dx:[],plan:""};cv=id;ct=0;rv()}
const TB=["Vitals","Malalamiko","Historia","Uchunguzi","Vipimo","Utambuzi","Dawa","Uamuzi"];
function cons(v){const p=pt(v.pid),c=v.cons,ro=v.st!=="doctor",n=[0,0,0,0,(v.ord||[]).length,c.dx.length,(v.rx||[]).length,0];
 return `<div class="pnl"><h3>${esc(p.name)} <span style="float:right;font-weight:400">${p.no}</span></h3><div class="pb ban"><div><small>Umri</small>${esc(p.age)}</div><div><small>Jinsia</small>${p.g}</div><div><small>Malipo</small>${esc(p.pay||"-")}</div><div><small>Simu</small>${esc(p.tel||"-")}</div><div><small>Makazi</small>${esc([p.k,p.m].filter(Boolean).join(", ")||"-")}</div>${c.alg?`<div><span class="alg">⚠ Mzio: ${esc(c.alg)}</span></div>`:""}</div></div>
<div class="tabs">${TB.map((t,i)=>`<button class="${ct===i?"on":""}" onclick="ct=${i};rv()">${t}${n[i]?` (${n[i]})`:""}</button>`).join("")}</div>
<div class="pnl" style="border-top:0;border-radius:0 0 4px 4px"><div class="pb">${ro?`<p class="mu">Ziara hii imekamilika — unaangalia tu. ${v.dr?"Daktari: "+esc(v.dr):""}</p>`:""}${tp(ct,v,c,ro)}</div></div>
<button class="b" onclick="cv=null;ct=0;rv()" style="padding:8px 16px">← Rudi kwenye orodha</button>`}
function tp(i,v,c,ro){const d=ro?"disabled":"";
 const ta=(k,l,r=3)=>`<label>${l}</label><textarea rows="${r}" ${d} onchange="setC('${k}',this.value)">${esc(c[k]||"")}</textarea>`;
 if(i===0){const t=v.vit;return t?`<div class="stats">${[["BP",t.bp],["Joto °C",t.tp],["Mapigo",t.pl],["RR",t.rr],["SpO₂ %",t.sp],["Uzito kg",t.wt],["Urefu cm",t.ht]].map(x=>`<div class="stat"><b style="font-size:20px">${esc(x[1]||"-")}</b><small>${x[0]}</small></div>`).join("")}</div><p class="mu">Zimepimwa na ${esc(t.by)} (nurse) · ${tm(t.at)}</p>`:`<p class="mu">Bado hajapimwa Triage.</p>`}
 if(i===1)return `<label>Muda wa tatizo</label><input ${d} value="${esc(c.dur||"")}" onchange="setC('dur',this.value)" style="width:100%">`+ta("cc","Malalamiko makuu (Chief Complaints)")+ta("hpi","Historia ya ugonjwa wa sasa (HPI)",5);
 if(i===2)return ta("alg","Mzio (Allergies)",2)+ta("pmh","Historia ya magonjwa ya nyuma")+ta("dh","Dawa anazotumia sasa",2)+ta("fh","Historia ya familia",2)+ta("sh","Historia ya jamii (pombe, sigara, kazi)",2);
 if(i===3)return ta("ex","Hali ya jumla (General Examination)")+ta("cvs","Moyo na mishipa (CVS)",2)+ta("rs","Mfumo wa kupumua (RS)",2)+ta("abd","Tumbo (Abdomen)",2)+ta("cns","Mfumo wa neva (CNS)",2);
 if(i===4){const sec=(k,t,L)=>`<h4 style="margin:6px 0">${t}</h4>${ro?"":`<div class="row"><select id="o_${k}">${L.map(x=>`<option>${x}</option>`).join("")}</select><button class="b" onclick="addOrd('${k}')">Agiza</button></div>`}<div class="tw"><table><tr><th>Kipimo</th><th>Hali</th><th>Matokeo</th><th></th></tr>${(v.ord||[]).filter(o=>o.k===k).map(o=>`<tr><td>${esc(o.t)}</td><td>${o.done?'<span class="st ok">Tayari</span>':'<span class="st wt">Inasubiri</span>'}</td><td>${o.done?rh(o):"-"}</td><td>${!o.done&&!ro?`<button class="d" onclick="delOrd('${o.id}')">✕</button>`:""}${o.done&&!o.seen&&isDr(me)?`<button class="b" onclick="ack('${v.id}','${o.id}')">Nimeona</button>`:""}</td></tr>`).join("")||`<tr><td class="mu">Hakuna</td></tr>`}</table></div>`;
  return (hm("maabara")?sec("lab","Maabara",LAB):`<p class="mu">Kituo hiki hakina maabara.</p>`)+(hm("radiolojia")?sec("rad","Radiolojia",RAD):"")+`<p class="mu">Daktari huagiza na kusoma matokeo; matokeo huingizwa na wafanyakazi wa maabara/radiolojia.</p>`}
 if(i===5)return `<datalist id="icd">${ICD.map(x=>`<option value="${x}">`).join("")}</datalist>${ro?"":`<div class="row"><input id="dxi" list="icd" placeholder="Tafuta utambuzi (ICD-10)"><select id="dxt"><option>Provisional</option><option>Final</option></select><button class="b" onclick="addDx()">Ongeza</button></div>`}<div class="tw"><table><tr><th>Utambuzi</th><th>Aina</th><th></th></tr>${c.dx.map((x,k)=>`<tr><td>${esc(x.t)}</td><td>${x.ty}</td><td>${ro?"":`<button class="d" onclick="delDx(${k})">✕</button>`}</td></tr>`).join("")||`<tr><td class="mu">Hakuna</td></tr>`}</table></div>`;
 if(i===6)return `<datalist id="drg">${dnames().map(x=>`<option value="${x}">`).join("")}</datalist>${ro?"":`<div class="row"><input id="rd" list="drg" placeholder="Dawa"><input id="rdo" placeholder="Dozi (mf. 1 tab)"><select id="rf"><option>OD</option><option>BD</option><option>TDS</option><option>QID</option><option>STAT</option><option>PRN</option></select><input id="rdy" type="number" min="1" placeholder="Siku"><select id="rrt"><option>PO</option><option>IV</option><option>IM</option><option>Topical</option><option>Inhaled</option></select><button class="b" onclick="addRx()">Ongeza</button></div>`}<div class="tw"><table><tr><th>Dawa</th><th>Dozi</th><th>Mara</th><th>Siku</th><th>Njia</th><th>Hali</th><th></th></tr>${(v.rx||[]).map(r=>`<tr><td>${esc(r.drug)}</td><td>${esc(r.dose)}</td><td>${r.fq}</td><td>${esc(r.days)}</td><td>${r.rt}</td><td>${r.disp?'<span class="st ok">Imetolewa</span>':'<span class="st wt">Famasia</span>'}</td><td>${!r.disp&&!ro?`<button class="d" onclick="delRx('${r.id}')">✕</button>`:""}</td></tr>`).join("")||`<tr><td class="mu">Hakuna</td></tr>`}</table></div><p class="mu">Daktari huandika dawa; famasia ndiyo hutoa.</p>`;
 if(ro)return `<p><b>Uamuzi:</b> ${stb(v.st)}</p>${v.rf?`<p>Rufaa kwenda: <b>${esc(v.rf.to)}</b> — ${esc(v.rf.rs)}</p>`:""}<p><b>Mpango / ushauri:</b> ${esc(c.plan||"-")}</p>`;
 return `<label>Uamuzi (Disposition)</label><select id="dd" onchange="$('#rfb').style.display=this.value==='referred'?'':'none'" style="width:100%"><option value="closed">Rudi nyumbani</option>${hm("wodi")?'<option value="admitted">Lazwa wodini</option>':""}<option value="referred">Toa rufaa</option></select><div id="rfb" style="display:none"><label>Rufaa kwenda (kituo)</label><input id="rto" style="width:100%"><label>Sababu ya rufaa</label><input id="rrs" style="width:100%"></div>${ta("plan","Mpango wa matibabu / ushauri",3).replace("onchange=","id=\"dpl\" onchange=")}<br><br><button class="b" onclick="finish()" style="padding:9px 18px">✔ Maliza ziara</button>`}
function setC(k,val){const v=ed();if(!v)return;v.cons[k]=val;save()}
function addOrd(k){const v=ed();if(!v)return;const t=$("#o_"+k)?.value;if(!t)return;(v.ord=v.ord||[]).push({id:uid("O"),k,t,res:"",done:false,by:me.name,byId:me.email,at:nowI()});save();rv()}
function delOrd(id){const v=ed();if(!v)return;v.ord=v.ord.filter(o=>o.id!==id||o.done);save();rv()}
function addDx(){const v=ed();if(!v)return;const t=$("#dxi").value.trim();if(!t)return;v.cons.dx.push({t,ty:$("#dxt").value});save();rv()}
function delDx(i){const v=ed();if(!v)return;v.cons.dx.splice(i,1);save();rv()}
function addRx(){const v=ed();if(!v)return;const d=$("#rd").value.trim();if(!d)return;(v.rx=v.rx||[]).push({id:uid("R"),drug:d,dose:$("#rdo").value.trim(),fq:$("#rf").value,days:$("#rdy").value,rt:$("#rrt").value,disp:false,by:me.name});save();rv()}
function delRx(id){const v=ed();if(!v)return;v.rx=v.rx.filter(r=>r.id!==id||r.disp);save();rv()}
function finish(){const v=ed();if(!v)return;
 if(!v.cons.dx.length){ct=5;rv();return alert("Weka utambuzi (diagnosis) kwanza")}
 const d=$("#dd").value;let rf=null;
 if(d==="referred"){const to=$("#rto").value.trim(),rs=$("#rrs").value.trim();if(!to||!rs)return alert("Jaza kituo cha rufaa na sababu");rf={to,rs}}
 if((v.ord||[]).some(o=>!o.done)&&!confirm("Kuna vipimo ambavyo matokeo bado. Endelea kumaliza?"))return;
 v.cons.plan=$("#dpl")?.value||v.cons.plan;v.rf=rf;v.st=d;v.dr=me.name;v.end=nowI();save();cv=null;ct=0;rv()}

/* ===== MAABARA / RADIOLOJIA: majibu hutumwa kwa daktari kupitia mfumo ===== */
const LP={"Malaria RDT":[["Matokeo","Positive,Negative"]],"Malaria BS (Smear)":[["Matokeo","Positive,Negative"],["Aina ya vimelea","P. falciparum,P. vivax,Mchanganyiko"],["Density",""]],"FBP / CBC":[["Hb","g/dL","12-17"],["WBC","x10³/µL","4-11"],["Platelets","x10³/µL","150-450"]],"Hemoglobin":[["Hb","g/dL","12-17"]],"Blood Sugar (RBS)":[["RBS","mmol/L","3.9-7.8"]],"Urinalysis":[["Protein","Negative,Trace,+,++,+++"],["Glucose","Negative,Trace,+,++,+++"],["Leucocytes","Negative,+,++,+++"],["Nitrites","Negative,Positive"]],"Widal Test":[["TO",""],["TH",""]],"Pregnancy Test (UPT)":[["Matokeo","Positive,Negative"]],"HIV Test":[["Matokeo","Reactive,Non-reactive"]],"Syphilis (VDRL)":[["Matokeo","Reactive,Non-reactive"]],"Hepatitis B":[["HBsAg","Reactive,Non-reactive"]],"Creatinine":[["Creatinine","µmol/L","60-110"]],"Liver Function Test":[["ALT","U/L","7-56"],["AST","U/L","10-40"],["Bilirubin","µmol/L","3-21"]]};
const RP=[["Maelezo (Findings)","*"],["Hitimisho (Impression)","*"]];
const pf=o=>o.k==="rad"?RP:(LP[o.t]||[["Matokeo",""]]);
const flag=(p,v)=>{if(!p[2]||v==="")return"";const[a,b]=p[2].split("-").map(Number);return +v<a?"L":+v>b?"H":""};
const fld=(o,p,i)=>{const id=`r_${o.id}_${i}`;return p[1]==="*"?`<textarea id="${id}" rows="3"></textarea>`:p[1].includes(",")?`<select id="${id}"><option value="">--</option>${p[1].split(",").map(x=>`<option>${x}</option>`).join("")}</select>`:`<input id="${id}" ${p[2]?'type="number" step="any"':""} placeholder="${p[1]}">`};
const rh=o=>!o.rs?esc(o.res||"-"):o.rs.map(x=>`${esc(x.n)}: <b class="${x.f?"hi":""}">${esc(x.v)}</b> ${esc(x.u||"")}${x.f?` <span class="hi">(${x.f==="H"?"Juu":"Chini"})</span>`:""}`).join("<br>")+`<br><small class="mu">Imetumwa na ${esc(o.rby||"")} · ${tm(o.rat)}${o.seen?" · ✔ Imeonekana":""}</small>`;
const vnew=v=>(v.ord||[]).filter(o=>o.done&&!o.seen).length;
const unseen=()=>me?DB.vs.filter(v=>v.fid==me.fid).reduce((n,v)=>n+(v.ord||[]).filter(o=>o.done&&!o.seen&&(!o.byId||o.byId===me.email)).length,0):0;
function ack(vid,oid){if(!isDr(me))return;const o=DB.vs.find(x=>x.id===vid)?.ord.find(x=>x.id===oid);if(!o)return;o.seen=true;o.sat=nowI();save();draw()}
function ordv(k){const rows=[],done=[];DB.vs.filter(v=>v.fid==me.fid).forEach(v=>(v.ord||[]).filter(o=>o.k===k).forEach(o=>(o.done?done:rows).push([v,o])));
 return `<div class="card"><h2>${k==="lab"?"Maabara":"Radiolojia"} – Vipimo vinavyosubiri (${rows.length})</h2><p class="mu">Majibu hutumwa moja kwa moja kwa daktari aliyeagiza kupitia mfumo.</p></div>`+
 rows.map(([v,o])=>{const p=pt(v.pid);return `<div class="pnl"><h3>${esc(o.t)} <span style="float:right;font-weight:400">${esc(p.name)} · ${p.no}</span></h3><div class="pb"><div class="mu">${esc(p.age)} / ${p.g} · Aliagiza: ${esc(o.by)} · ${tm(o.at)}</div><div class="g4">${pf(o).map((x,i)=>`<div><label>${x[0]}${x[2]?` <span class="mu">(${x[1]}; ${x[2]})</span>`:""}</label>${fld(o,x,i)}</div>`).join("")}</div><button class="b" style="padding:8px 14px;margin-top:8px" onclick="saveRes('${v.id}','${o.id}')">📤 Tuma Majibu kwa Daktari</button></div></div>`}).join("")+
 `<div class="card"><h2>Yaliyotumwa (hivi karibuni)</h2><div class="tw"><table><tr><th>Mgonjwa</th><th>Kipimo</th><th>Matokeo</th><th>Hali</th></tr>${done.slice(-8).reverse().map(([v,o])=>`<tr><td>${esc(pt(v.pid).name)}</td><td>${esc(o.t)}</td><td style="white-space:normal">${rh(o)}</td><td>${o.seen?'<span class="st ok">Imeonekana</span>':'<span class="st wt">Imetumwa</span>'}</td></tr>`).join("")||`<tr><td class="mu">Hakuna</td></tr>`}</table></div></div>`}
function saveRes(vid,oid){const v=DB.vs.find(x=>x.id===vid),o=v?.ord.find(x=>x.id===oid);if(!o||o.done||(o.k==="lab"&&!R("lab_tech"))||(o.k==="rad"&&!R("radiologist")))return;
 const P=pf(o),rs=[];for(let i=0;i<P.length;i++){const x=($(`#r_${oid}_${i}`)?.value||"").trim();if(!x){if(P[i][1]==="*")return alert("Jaza maelezo na hitimisho");continue}
  rs.push({n:P[i][0],v:x,u:P[i][1].includes(",")||P[i][1]==="*"?"":P[i][1],f:flag(P[i],x)})}
 if(!rs.length)return alert("Weka matokeo");
 o.rs=rs;o.res=rs.map(x=>`${x.n}: ${x.v}${x.f?" ("+x.f+")":""}`).join("; ");o.done=true;o.seen=false;o.rby=me.name;o.rat=nowI();save();draw()}
